# ffigen configuration for the CrossTransfer core C API.
# Regenerate: dart run ffigen --config ffigen.yaml
name: CtBindings
description: Dart FFI bindings for crosstransfer_native (core/include/crosstransfer/ct_api.h).
output: lib/ffi/ct_bindings.g.dart
headers:
  entry-points:
    - ../core/include/crosstransfer/ct_api.h
  include-directives:
    - '**ct_api.h'
functions:
  include:
    - 'Ct.*'
  symbol-address:
    include:
      - 'CtFreeString'
enums:
  include:
    - CtStatus
  as-int:
    include:
      - CtStatus
typedefs:
  include:
    - CtEventCallback
structs:
  include:
    - CtCore
preamble: |
  // Generated by ffigen from core/include/crosstransfer/ct_api.h. Do not edit.
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
