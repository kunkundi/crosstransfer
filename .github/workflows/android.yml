name: Android Phase 4
on:
  push:
    branches: [main, 'codex/phase4-android']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      CT_ANDROID_ABIS: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.0'
      - uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: android-native-v1-${{ matrix.abi }}-${{ hashFiles('xmake.lua', 'minirtc/**/xmake.lua') }}
          restore-keys: android-native-v1-${{ matrix.abi }}-
      - name: NDK and native engine
        run: |
          sdkmanager 'ndk;28.2.13676358'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          tools/build_android_native.sh
          python3 tools/check_android_native.py "app/android/app/src/main/jniLibs/$CT_ANDROID_ABIS/libcrosstransfer_native.so"
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-${{ matrix.abi }}
          path: app/android/app/src/main/jniLibs/
