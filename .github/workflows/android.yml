name: Android Phase 4
on:
  push:
    branches: [main, 'codex/phase4-android', 'codex/phase5-hardening']
    paths: &android-paths
      - 'app/**'
      - 'core/**'
      - 'minirtc/**'
      - 'server/**'
      - 'xmake.lua'
      - '.gitattributes'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/licenses/**'
      - 'tools/*android*'
      - 'tools/check_legal_assets.py'
      - 'tools/check_pub_notices.py'
      - 'tools/check_flutter_legal_bundle.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths: *android-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    env:
      CT_ANDROID_ABIS: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.0'
      - uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: android-native-v1-${{ matrix.abi }}-${{ hashFiles('xmake.lua', 'minirtc/**/xmake.lua') }}
          restore-keys: android-native-v1-${{ matrix.abi }}-
      - name: NDK and native engine
        run: |
          # The project owner authorized these SDK/NDK license terms.
          yes y | sdkmanager 'ndk;28.2.13676358' || test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          tools/build_android_native.sh
          python3 tools/check_android_native.py "app/android/app/src/main/jniLibs/$CT_ANDROID_ABIS/libcrosstransfer_native.so"
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-${{ matrix.abi }}
          path: app/android/app/src/main/jniLibs/
  app:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reserve disk for Flutter and the Android emulator
        run: |
          # Only remove unrelated, preinstalled tools on this disposable runner.
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v4
        with:
          pattern: android-native-*
          merge-multiple: true
          path: app/android/app/src/main/jniLibs/
      - name: SDK and emulator acceleration
        run: |
          yes y | sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'platform-tools' || test -f "$ANDROID_HOME/build-tools/36.0.0/source.properties"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Flutter checks and test-signed release APK
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          python3 ../tools/check_legal_assets.py
          python3 ../tools/check_pub_notices.py
          flutter analyze
          flutter test
          flutter build apk --release
          (cd android && ./gradlew :app:verifyRuntimeLicenses)
          python3 ../tools/check_android_notices.py
          python3 ../tools/check_android_apk.py build/app/outputs/flutter-apk/app-release.apk
      - name: Runtime FFI, P2P and relay on Android 15
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            (cd app/android && ./gradlew :app:connectedDebugAndroidTest -Ptarget-platform=android-x64)
            tools/test_android_native.sh emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-local-test-apk
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/reports/androidTests/connected/debug/
