name: Server hardening
on:
  push:
    branches: [main, 'codex/phase5-hardening']
    paths: &server-paths
      - 'server/**'
      - 'tools/check_server_container.py'
      - 'tools/check_go_notices.py'
      - 'docs/licenses/go_manifest.json'
      - '.gitattributes'
      - '.github/workflows/server.yml'
  pull_request:
    paths: *server-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Race tests and vet
        working-directory: server
        run: |
          go test -race ./...
          go vet ./...
      - name: Verify embedded Go license notices
        run: python3 tools/check_go_notices.py
      - name: Container startup and deployment routes
        run: |
          docker build -t crosstransfer/ctserver:check server
          python3 tools/check_server_container.py crosstransfer/ctserver:check
      - uses: docker/setup-buildx-action@v3
      - name: Export amd64 and arm64 OCI image
        run: |
          mkdir -p dist
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            --build-arg VERSION="${GITHUB_SHA::12}" \
            --output type=oci,dest=dist/ctserver-linux-amd64-arm64.oci.tar \
            -t crosstransfer/ctserver:check server
          (cd dist && sha256sum ctserver-linux-amd64-arm64.oci.tar > ctserver-linux-amd64-arm64.oci.tar.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: ctserver-linux-amd64-arm64
          path: dist/ctserver-*.oci.tar*
          if-no-files-found: error
